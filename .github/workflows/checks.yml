# 【中文】每次推送与 PR：检查登记表（变量、关系、参数、文献、可信度、core.yaml）并运行模型行为测试
# On every push and pull request: check the registers and run the model behaviour tests.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt pytest
      - name: Registry
        run: python -m pipeline.registry
      - name: Tests
        run: python -m pytest -q tests
