# 【中文】精简主线模型（骨架）的组成：主线环节 links 与暂缓的细节 deferred。说明见 docs/CORE_MODEL.md。
# relations 写成 "关系编号:级别"；couplings / citations / methods 必须分别在 couplings.csv / references.yaml /
# PIPELINE_SPEC.md 中存在（python -m pipeline.registry 检查）。relations.csv 的 current 列表示代码库中已实现的
# 最高级别（任一模型）；本文件说明骨架模型实际用哪一级。
# Core (skeleton) model: main-chain links and deferred details. Checked by `python -m pipeline.registry`.
# relations.csv "current" = highest tier implemented anywhere in the code; this file states what the core uses.

full_model:
  code: pipeline/cascade.py + pipeline/twin/cascade.py
  preserved_as: "git branch full-model, tag full-model-v1 (commit 04eb531)"

selection_rule:
  en: >-
    A link is in the core if (1) the literature documents it as a pathway from heat to population harm during
    heat-wave power outages, (2) removing it would cut the chain from air temperature to the outcome, and (3) it
    can be run on data we already hold. Links that add a second-order effect, rely on a mechanism the literature
    warns against, or showed no effect in our own data are deferred, with the code kept.
  zh: >-
    入选主线的条件：（1）文献把它记录为"高温 → 停电 → 人群受害"链条上的一环；（2）去掉它，从气温到结局的链条就断了；
    （3）用现有数据就能运行。属于二阶效应、所用机制被文献质疑、或在我们自己的数据中没有作用的环节暂缓，代码保留。

links:
  - id: K1
    upstream: []
    name_en: Urban air-temperature field
    name_zh: 城市气温场
    methods: [M-6]
    relations: []
    couplings: []
    citations: [shandas2019, ho2014]
    evidence_en: Traverse-based air-temperature models resolve intra-urban differences of several kelvin; every later link is driven by local air temperature.
    evidence_zh: 基于走航测温的气温模型能分辨城市内部数开尔文的差异；后面每一环都由本地气温驱动。
  - id: K2
    upstream: [K1]
    name_en: Local air temperature → cooling load; base load does not depend on temperature
    name_zh: 本地气温 → 制冷负荷；基础负荷不随气温
    methods: []
    relations: []
    couplings: [C-P1, C-P1.T0, C-P1.Kd, C-P1.Td]
    citations: [auffhammer2017, bartos2016, cascadingheat2026, salamanca2014]
    evidence_en: >-
      Peak demand rises with temperature through cooling load; this is the first step of every heat–grid pathway. Since
      2026-11-20 the load is shown as a base load that does not depend on temperature (1/m(Td) of the design-day load)
      plus a cooling load β·max(0, T − T0). Cooling load also feeds back on air temperature through air-conditioning
      waste heat (loop F1; Salamanca et al. 2014), which the model does not simulate.
    evidence_zh: >-
      峰值负荷通过制冷负荷随气温上升，是所有"高温 → 电网"路径的第一步。2026-11-20 起负荷分成不随气温的基础负荷（占设计日负荷的 1/m(Td)）
      和制冷负荷 β·max(0, T − T0)。制冷负荷还通过空调排热反过来抬高气温（循环 F1；Salamanca 等 2014），模型未模拟这一反馈。
  - id: K3
    upstream: [K1, K2]
    name_en: Base + cooling load and air temperature → transformer hot spot → thermal failure
    name_zh: 基础负荷 + 制冷负荷与气温 → 变压器热点温度 → 热失效
    methods: []
    relations: []
    couplings: [C-P2.dTOR, C-P2.dHR, C-P2.R, C-P2.n, C-P2.m, C-P2.tau, C-P3, C-P3.sigma]
    citations: [ieee_c5791_2011, bartos2016, shinozuka2000]
    evidence_en: Heat reduces substation capacity while load rises; the IEEE C57.91 thermal model is the standard way to turn both into insulation stress.
    evidence_zh: 高温降低变电设备容量、同时推高负荷；IEEE C57.91 热模型是把两者转换为绝缘热应力的标准方法。
  - id: K5
    upstream: [K3]
    name_en: Failed substation → outage of the zone it serves; fixed restoration time
    name_zh: 失效的变电站 → 它供电的分区停电；固定修复时长
    methods: []
    relations: ["R-POP1:1"]
    couplings: [C-P6, C-POP1]
    citations: [eaglei2023, stone2023]
    evidence_en: >-
      A thermally failed substation cuts power to the zone it serves until restoration (C-P6, from EAGLE-I). Since
      2026-11-20 outages no longer propagate down the supply topology: that dependency (D13) rested on OSM lines with
      unknown switch states.
    evidence_zh: >-
      热失效的变电站使它供电的分区停电，直到恢复（C-P6，来自 EAGLE-I）。2026-11-20 起停电不再沿供电拓扑向下游传播：
      这种依赖（D13）建立在开关状态未知的 OSM 线路上。
  - id: K6
    upstream: [K5]
    name_en: Zone outage → water plants (backup) → storage exhausted → water loss
    name_zh: 分区停电 → 水厂（备用电源）→ 储水耗尽 → 断水
    methods: []
    relations: ["R-W3:0", "R-W1:0", "R-W2:0"]
    couplings: [C-W1, C-W2, C-W3]
    citations: [rinaldi2001, klise2017]
    evidence_en: Water treatment and pumping depend on electric power; storage gives hours of buffer. This is the water system's main dependency on power.
    evidence_zh: 制水和加压依赖电力，储水提供数小时缓冲；这是供水系统对电力的主要依赖。
  - id: K7
    upstream: [K5, K6]
    name_en: Hospitals — zone outage with backup failure, or system water loss beyond on-site supply
    name_zh: 医院：分区停电且备用电源失效，或全系统断水超过院内储水时长
    methods: []
    relations: ["R-H1:1"]
    couplings: [C-H1, C-H18]
    citations: [cms2016, marqusee2020, irvinbarnwell2020]
    evidence_en: >-
      Since 2026-11-17 the medical-facility node holds hospitals only (dialysis centres and nursing homes moved to D10).
      Hospitals use electricity and water heavily: CMS requires backup power, which can fail, and emergency plans that
      cover water, but no minimum on-site volume. A hospital loses ED capacity for the hours it is closed; its patients
      move to the next open hospital.
    evidence_zh: >-
      2026-11-17 起医疗设施节点只含医院（透析中心和养老院移到 D10）。医院大量用电用水：CMS 要求备用电源（可能失效），
      应急预案要覆盖用水，但没有院内储水量的下限。医院关闭的小时数按比例减少急诊接诊能力，病人改去下一家开放的医院。
  - id: K8
    upstream: [K5, K7]
    name_en: Zone outage → dark traffic signals → link capacity → travel time to hospitals
    name_zh: 分区停电 → 信号灯熄灭 → 路段通行能力下降 → 到医院的行程时间
    methods: [M-28, M-29]
    relations: ["R-T3:0", "R-T1:1", "R-T4:2", "R-H3:2"]
    couplings: [C-T2, C-T3, C-T5, C-T6.a, C-T6.b, C-T6.cap_fwy, C-T6.cap_art, C-T6.cap_loc]
    citations: [rinaldi2001, ouyang2014, hcm2022, bpr1964, kelman2015]
    evidence_en: >-
      The transport link with a direct health consequence: signals depend on grid power (Rinaldi et al. 2001), a dark
      signal operates as an all-way stop with reduced capacity (HCM), and patients of a closed hospital must travel
      to another. Computed per run at that run's worst hour, with the run's own dark signals and hospital closures,
      so tail cases are kept rather than averaged away.
    evidence_zh: >-
      交通系统中与健康结局直接相关的一环：信号灯依赖电网供电（Rinaldi 等 2001）；信号灯熄灭后按全向停车控制处理，
      通行能力下降（HCM）；医院关闭时病人必须去另一家。按每次运行在其最坏小时的实际状态
      （该次运行熄灭的信号灯和关闭的医院）计算，保留尾部情形，而不是像完整模型那样按期望值平均掉。
  - id: K9
    upstream: [K1, K5]
    name_en: Outage → loss of air conditioning → indoor temperature → indoor heat exposure
    name_zh: 停电 → 失去空调 → 室内温度 → 室内高温暴露
    methods: [M-32, M-33]
    relations: ["R-H5:1"]
    couplings: [C-B1, C-B2, C-B3, C-B4, C-H10]
    citations: [stone2023, sun2020]
    evidence_en: Stone et al. (2023) found that a multiday blackout during a heat wave more than doubles heat-related mortality, through indoor temperature once cooling is lost. This is the link from infrastructure to health.
    evidence_zh: Stone 等（2023）发现热浪期间的多日停电使高温死亡率增加一倍以上，机制是失去制冷后的室内温度。这是从基础设施到健康的关键一环。

  - id: K10
    upstream: [K1, K5, K7, K9]
    name_en: Line B — heat exposure → heat illness → care demand; zone outage → ventilator and other device users → care demand; demand → ED waiting → time to care
    name_zh: B 线：高温暴露 → 热病症 → 就医需求；分区停电 → 呼吸机等设备用户 → 就医需求；需求 → 急诊等待 → 就医时间
    methods: [M-47]
    relations: ["R-H5:3", "R-H6:1", "R-H8:0"]
    couplings: [C-H11, C-H11.a, C-H12, C-H13, C-H14, C-H15, C-H16]
    citations: [tdh_hri_ed, gasparrini2015, lin2011, hhs_empower, sun2020]
    evidence_en: >-
      Heat-illness visits = a + k · indoor heat person-hours, with k calibrated on Davidson's annual heat-illness ED
      visits 2014–2023 against simulated exposure (R² 0.75, ρ 0.70). Users of ventilators and other electricity-dependent
      home devices (HHS emPOWER, 4,163 Medicare beneficiaries; 3,864 allocated to zones) seek care with probability q
      once a zone outage outlasts the device battery. Heat illness and device users are separate sources of care
      demand. Peak-day extra visits raise waiting at per-hospital queues (W = W0·ρ/(1−ρ), ρ ≤ 0.95); time to care is
      per ED visit (travel + waiting, pipeline/care.py) and is decomposed by cause (pipeline/extremes.py). The waiting
      step rests on T4 assumptions (ρ0, D0, W0, q).
    evidence_zh: >-
      热病症就诊 = a + k × 室内高温暴露人·小时，k 用 Davidson 2014–2023 年度急诊人次对模拟暴露校准（R² 0.75，ρ 0.70）。
      呼吸机等家用医疗设备用户（HHS emPOWER，4,163 名医保受益人，3,864 人分配到分区）在分区停电超过设备电池时长后以概率 q 就医。
      热病症与设备用户是两个独立的就医需求来源。高峰日新增就诊按 W = W0·ρ/(1−ρ)（ρ ≤ 0.95）增加各医院的等待；
      就医时间按急诊就诊人次计算（路程 + 等待，pipeline/care.py），并按原因分解（pipeline/extremes.py）。等待这一步依赖 T4 假设（ρ0、D0、W0、q）。

  - id: K11
    upstream: [K1]
    name_en: Pavement heat → rutting → road roughness → travel time to hospitals
    name_zh: 路面高温 → 车辙 → 路面平整度 → 到医院的路程
    methods: [M-49]
    relations: ["R-T8:1"]
    couplings: [C-T8, C-T11, C-T12]
    citations: [fhwa_hpms2024, wang2014roughness]
    evidence_en: >-
      Added at the user's request on 2026-11-20. Rut depth in Davidson is about 1.8% deeper per °C of summer road LST
      (HPMS 2024, cross-sectional); deeper ruts raise roughness, and roughness lowers free-flow speed only slightly
      (about 0.3–0.4 mph per 1 m/km of IRI; Wang et al. 2014). The change in travel time to the nearest hospital is
      added to time to care. Rutting builds up over years, so this is a long-run effect of warming, not a heat-wave one.
    evidence_zh: >-
      2026-11-20 按用户要求加入。Davidson 的车辙深度随夏季路面地表温度每 °C 约深 1.8%（HPMS 2024，横截面）；车辙加深使路面变粗糙，
      而粗糙度对自由流车速的影响很小（IRI 每增加 1 m/km 车速约降 0.3–0.4 mph；Wang 等 2014）。到最近医院的路程变化计入就医时间。
      车辙是多年累积的，所以这是升温的长期效应，不是热浪当天的效应。
deferred:
  - id: D1
    name_en: Peer load transfer and overload trips (Motter–Lai)
    name_zh: 同电压站之间的负荷转移与过载跳闸（Motter–Lai）
    relations: ["R-P1:1"]
    couplings: [C-P4]
    citations: [motter2002, hines2010, dobson2007]
    reason_en: >-
      Topological load redistribution can misrepresent power-system vulnerability (Hines et al. 2010); real cascades
      follow power flow (Dobson et al. 2007). In the full model, with an assumed tolerance α, overload trips were
      the main source of outages and made up 86–92% of person-hours without power across scenarios (county run of
      2026-11-11: 777k vs 62k at +0 °C, 30.0M vs 4.08M at +4 °C). Return as a DC power-flow tier (R-P5 tier 2–3) when ratings are available.
    reason_zh: >-
      纯拓扑的负荷重分配可能误判电网脆弱性（Hines 等 2010）；真实的连锁停电服从潮流（Dobson 等 2007）。
      完整模型中，在假设的容忍度 α 下，这一机制是停电的主要来源，各情景 86–92% 的停电人·小时来自它
      （2026-11-11 全县运行：+0 °C 777k 对 62k，+4 °C 30.0M 对 4.08M）。有额定值后以直流潮流（R-P5 2–3 级）的形式加回。
  - id: D2
    name_en: River temperature → thermal plant derating (supply side of K4)
    name_zh: 河水温度 → 火电降额（K4 的供给侧）
    relations: ["R-W5:2"]
    couplings: [C-P9, C-P9.span, C-P9.Qmin, C-P9.flow]
    citations: [vanvliet2012, mohseni1998stream]
    reason_en: Documented for drought–heat years, but the modelled Cumberland temperature stayed below the derating threshold in 2014–2025 (max 27.3 °C) and derating was identical across scenarios.
    reason_zh: 文献记录了干旱高温年份的降额，但 2014–2025 年模拟的坎伯兰河水温始终低于降额阈值（最高 27.3 °C），各情景降额相同。
  - id: D3
    paused: true   # 2026-11-10: economic outcomes paused by the user
    name_en: Pavement heat → rutting → resurfacing cost
    name_zh: 路面高温 → 车辙 → 铺装维修成本
    relations: ["R-T7:1", "R-T7:3"]
    couplings: [C-T1, C-T1.sigma]
    citations: [underwood2017, chinowsky2013, fhwa_hpms2024, fhwa_pm2_2017]
    reason_en: >-
      A long-run economic pathway (annual resurfacing cost), not part of the acute outage cascade, so it feeds the
      economic endpoint D9. HPMS 2024 shows a signal: rut depth is about 1.8% deeper per °C of summer LST after road
      class and traffic (4,269 sections, R² 0.09; scripts/rutting_lst.py), but the test is cross-sectional without
      pavement age or binder grade. Earlier, the LST exceedance score did not beat segment length for 311 requests,
      which are not a rutting measure. Needs unit costs (C-T9) and a panel of rut surveys before it can be costed.
    reason_zh: >-
      属于长期经济路径（每年的铺装成本），不属于急性停电级联，因此接到经济损失结局 D9。HPMS 2024 显示存在信号：
      控制道路等级和交通量后，夏季 LST 每高 1 °C 车辙深约 1.8%（4,269 个路段，R² 0.09；scripts/rutting_lst.py），
      但这是横截面检验，没有路面年龄和沥青等级。此前用 311 报修验证时 LST 指标不如路段长度，而 311 并不是车辙的度量。
      要计算成本还需要单价（C-T9）和多年车辙测量。
  - id: D5
    name_en: Outdoor compound heat–outage threshold
    name_zh: 室外复合暴露阈值
    relations: ["R-H5:0"]
    couplings: [C-POP2]
    citations: [stone2023]
    reason_en: Replaced by K9, which models the mechanism (indoor temperature) instead of an outdoor threshold.
    reason_zh: 由 K9 取代：K9 模拟的是机制本身（室内温度），而不是室外阈值。
  - id: D6
    name_en: Heat- and outage-attributable deaths and ED visits
    name_zh: 高温与停电归因死亡和急诊
    relations: ["R-H5:2"]
    couplings: [C-H4, C-H5]
    citations: [gasparrini2015, anderson2012, stone2023]
    reason_en: Needs a Nashville temperature–mortality curve and baseline deaths (HLT-13, HLT-14); the core stops at indoor exposure, the input such a model would take.
    reason_zh: 需要 Nashville 的温度–死亡曲线和基线死亡数（HLT-13、HLT-14）；骨架停在室内暴露，这正是该模型需要的输入。
  - id: D7
    name_en: Restoration as a crew and access process
    name_zh: 以抢修队和可达性描述的修复过程
    relations: ["R-X1:2"]
    couplings: []
    citations: [liu2007]
    reason_en: Fixed repair time is kept until NES restoration records are available.
    reason_zh: 在拿到 NES 修复记录之前保留固定修复时长。
  - id: D8
    name_en: Distribution transformers, line ampacity, water hydraulics (pressure zones serving each hospital), cooling centres
    name_zh: 配电变压器、线路载流量、供水水力（各医院所在的压力分区）、避暑中心
    relations: ["R-P6:1", "R-P5:2", "R-W1:2s", "R-H6:2", "R-H2:2", "R-H4:1"]
    couplings: []
    citations: [bartos2016, ieee738_2012, klise2017, molinari2017, kelman2015]
    reason_en: >-
      Each refines a core link but needs data we do not hold (NES assets, Metro Water hydraulic model). The core
      treats water loss as system-wide (all plants out and storage exhausted); a hydraulic model would show which
      hospitals lose pressure first.
    reason_zh: >-
      每一项都是对某个主线环节的细化，但需要尚未获得的数据（NES 资产、Metro Water 水力模型）。骨架把断水当作全系统事件
      （所有水厂停产且储水耗尽）；有水力模型后才能知道哪家医院先失压。
  - id: D9
    paused: true   # 2026-11-10: economic outcomes paused by the user
    name_en: Economic loss (customer interruption costs; monetised health outcomes)
    name_zh: 经济损失（用户停电损失；健康结局货币化）
    relations: []
    couplings: []
    citations: [sullivan2015, usdot_vsl]
    reason_en: >-
      The second endpoint besides health. Outage cost = customer-hours without power by class × value of service
      reliability (LBNL ICE Calculator, Sullivan et al. 2015); health cost = attributable deaths × VSL plus care costs,
      which waits for D6. Reported separately, not summed. Needs NES customers by class per zone.
    reason_zh: >-
      健康之外的第二个结局。停电损失 = 各类用户停电的用户·小时 × 供电可靠性价值（LBNL ICE 计算器，Sullivan 等 2015）；
      健康损失 = 归因死亡 × 统计生命价值加医疗费用，需等 D6。两者分开报告，不相加。需要 NES 按分区、用户类别的户数。
  - id: D10
    paused: true   # 2026-11-17: medical facilities = hospitals only, at the user's request
    name_en: Dialysis centres and nursing homes
    name_zh: 透析中心与养老院
    relations: ["R-H7:1", "R-H2:2"]
    couplings: [C-H2, C-H3, C-H17]
    citations: [kelman2015, hhs_oig_nh2026, meade2024]
    reason_en: >-
      Removed from the core on 2026-11-17 so the medical-facility node holds hospitals only. In the 2026-11-11 runs
      they did not change time to care (nursing homes about 0%); dialysis sessions affected (about 69 per summer at
      +4 °C) are recorded in git 7298ae6. Code for both remains in the full model.
    reason_zh: >-
      2026-11-17 起从骨架中移除，医疗设施节点只保留医院。在 2026-11-11 的运行中它们对就医时间几乎没有影响（养老院约 0%）；
      受影响的透析次数（+4 °C 时每个夏季约 69 次）记录在 git 7298ae6。两者的代码保留在完整模型中。
  - id: D12
    name_en: System supply shortfall → rotating outages
    name_zh: 系统供需缺口 → 轮流停电
    methods: [M-18]
    relations: ["R-P0:2"]
    couplings: [C-P9.avail, C-P9.imp]
    citations: [auffhammer2017, eia860, eia930]
    reason_en: >-
      Former K4, deferred on 2026-11-20. A TVA shortfall appeared in 4% of +4 °C runs and switching it off changed time
      to care by 0% (knockouts R05, R06, 2026-11-17; 2,000-run check 2026-11-19). It returns with a regional heat-wave
      scenario in which TVA reserves are actually short. Runs with `python -m pipeline.core --shortfall`.
    reason_zh: >-
      原 K4，2026-11-20 暂缓。+4 °C 时只有 4% 的运行出现 TVA 缺口，关掉它对就医时间的影响为 0%（敲除 R05、R06，2026-11-17；
      2026-11-19 的 2,000 次检查）。等有 TVA 备用确实不足的区域热浪情景时加回。用 `python -m pipeline.core --shortfall` 运行。
  - id: D13
    name_en: Supply dependency along the grid topology
